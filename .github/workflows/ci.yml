name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install lightweight test dependencies
        run: uv pip install --system pytest ruff openai pyarrow huggingface_hub
      - name: Download released annotations
        run: python scripts/download_data.py
      - name: Lint
        run: |
          ruff check scripts rubric/openai_client.py \
            verl/experimental/reward_loop/reward_manager/rubric_scripts.py \
            verl/experimental/reward_loop/reward_manager/rubric_scripts_task.py
      - name: Test release surface
        run: |
          python -m pytest -q \
            tests/test_launchers.py \
            tests/test_openai_client.py \
            tests/test_released_data.py
